# iOS Pipeline Phase Configuration - OS 7.0
# Native iOS Development Workflow

pipeline:
  name: ios
  description: Native iOS development pipeline with Swift/SwiftUI/UIKit
  version: "7.0"

# Phase State Schema (OS 7.0)
phase_state:
  # Top-level fields
  domain: ios
  complexity_tier: simple | medium | complex
  requirement_id: string | null           # Links to requirements/<id>
  requirements_spec_path: string | null   # Path to 06-requirements-spec.md
  current_phase: string
  memory_summary: string | null           # Hits from memory-first search

  # Mode Tracking (OS 7.0)
  current_mode: planning | execution      # NEW: Explicit mode tracking
  mode_history:                           # NEW: Track mode transitions
    - mode: string
      timestamp: string
      reason: string

  # Attempt Tracking (OS 7.0)
  current_phase_attempts: 0               # NEW: Track retry attempts
  max_attempts: 3                         # NEW: Hard limit per spec

  # Phase entries (each has status, timestamps, data)
  phases:
    context_query: object
    planning: object
    analysis: object
    implementation_pass1: object
    standards_gate: object
    ui_review_gate: object
    implementation_pass2: object | null   # Only if gate failed
    verification: object

# Four-Tier Routing (OS 7.0)
# Default now runs gates. --tweak skips gates. --complex forces full pipeline.
complexity_tiers:
  default:
    description: Light path WITH quality gates (most work)
    flag: "(none)"
    routing: "/ios command (main thread, flat pattern)"
    mode: default  # Runs gates
    spec_required: false
    gates_required: true   # DEFAULT NOW RUNS GATES
    gates:
      - ios-standards-enforcer
      - ios-ui-reviewer
    examples:
      - Fix button padding
      - Change label text
      - Add haptic feedback
      - Update color to token
      - Modify single view

  tweak:
    description: Light path WITHOUT gates (pure speed)
    flag: "--tweak"
    routing: "/ios command (main thread, flat pattern)"
    mode: tweak  # Skips gates
    spec_required: false
    gates_required: false  # User verifies
    examples:
      - Rapid iteration
      - Exploring options
      - Quick experiments

  complex:
    description: Full pipeline (ios-architect + all gates, command-sequenced)
    flag: "--complex"
    routing: full_pipeline
    mode: complex
    spec_required: true    # BLOCKS without spec
    gates_required: true
    examples:
      - Multi-screen flow
      - Authentication system
      - Data layer changes
      - Offline sync

# Context Integration (MANDATORY for medium/complex)
context:
  provider: ProjectContextServer
  required: true
  query_on_start: true
  memory_first: true      # Check Workshop/code-index.db before ProjectContext

# Pipeline Phases
phases:
  # Phase 1: Requirements & Impact Analysis
  - name: requirements_impact
    agent: ios-architect
    description: Analyze requirements and assess impact on iOS codebase
    context_required: true
    outputs:
      - change_type
      - affected_views
      - affected_models
      - risks
    constraints:
      scope: Analysis only, no code changes
      quality: Complete architecture assessment
      integration: Must identify SwiftUI vs UIKit patterns

  # Phase 2: Architecture & Planning
  - name: planning
    agent: ios-architect
    description: Create architecture plan with Swift/iOS patterns
    dependencies:
      - requirements_impact
    context_required: true
    outputs:
      - architecture_path
      - data_strategy
      - plan_summary
      - assigned_agents
    constraints:
      scope: Respect existing patterns (SwiftUI/UIKit/MVVM/TCA)
      quality: Clear module boundaries and dependencies
      integration: Design token verification for UI work

  # Phase 3: Analysis
  - name: analysis
    agent: ios-architect
    description: Deep structural analysis of affected iOS components
    dependencies:
      - planning
    context_required: true
    outputs:
      - view_structure
      - state_patterns
      - data_flow
      - navigation_map
    constraints:
      scope: Read-only analysis, map existing patterns
      quality: Complete dependency graph
      integration: Identify all token/styling sources

  # Phase 4: Implementation - Pass 1
  - name: implementation_pass1
    agent: ios-builder
    description: Primary implementation with specialist delegation
    dependencies:
      - analysis
    context_required: true
    inputs:
      - architecture_path
      - data_strategy
      - design_tokens
    outputs:
      - files_modified
      - changes_manifest
      - tests_added
      - ra_events          # RA tags added during implementation
    constraints:
      scope: Edit-not-rewrite, minimal diffs
      quality: Swift 6 semantics, modern concurrency
      integration: Design token enforcement
      resource: Max file edits per pass

  # Phase 5: Standards Gate
  - name: standards_gate
    agent: ios-standards-enforcer
    description: Swift/iOS standards and safety verification
    dependencies:
      - implementation_pass1
    context_required: true
    inputs:
      - files_modified
      - related_standards
    outputs:
      - standards_score
      - violations
      - gate_decision
      - ra_audit           # RA tag scan results
    quality_gates:
      standards_score:
        threshold: 90
        type: hard_block
        message: Standards score must be e90
      force_unwraps:
        threshold: 0
        type: soft_warning
        message: Avoid force unwraps without justification
      concurrency:
        threshold: 100
        type: hard_block
        message: Must use modern Swift concurrency

  # Phase 6: UI Review Gate (Code Review Only)
  - name: ui_review_gate
    agent: ios-ui-reviewer
    description: Code-based UI review (no simulator access)
    mode: code_review_only
    dependencies:
      - implementation_pass1
    context_required: true
    inputs:
      - files_modified
      - design_tokens
    outputs:
      - code_review_score
      - token_violations
      - accessibility_in_code
      - items_needing_visual_verification
    quality_gates:
      code_review_score:
        threshold: 90
        type: hard_block
        message: Code review score must be >=90
      token_compliance:
        threshold: 100
        type: hard_block
        message: No hardcoded colors/spacing/fonts allowed
      accessibility_labels:
        threshold: 85
        type: soft_warning
        message: Accessibility labels in code recommended

  # Phase 4b: Implementation - Pass 2 (Corrective)
  - name: implementation_pass2
    agent: ios-builder
    description: Corrective implementation for gate failures only
    dependencies:
      - standards_gate
      - ui_review_gate
    condition: any_gate_failed
    context_required: true
    inputs:
      - violations
      - visual_issues
    outputs:
      - files_modified
      - fixes_applied
    constraints:
      scope: Fix violations only, no new features
      quality: Address all critical issues
      integration: Re-run failed gates only
      resource: Single corrective pass only

  # Phase 7: Build, Test & Visual Verification
  - name: verification
    agent: ios-verification
    description: Build, test, and visual verification (ONLY agent with simulator)
    mode: full_verification
    mcp_access:
      - XcodeBuildMCP (bootSimulator, buildProject, runTests, screenshot, describe_ui)
    dependencies:
      - standards_gate
      - ui_review_gate
    context_required: true
    inputs:
      - items_needing_visual_verification  # From Phase 6
      - user_screenshot  # If provided
    outputs:
      - build_status
      - test_results
      - coverage_metrics
      - warnings_count
      - screenshots
      - pixel_measurements
      - visual_verification_result
    quality_gates:
      build:
        threshold: pass
        type: hard_block
        message: Build must succeed
      tests:
        threshold: pass
        type: hard_block
        message: All tests must pass
      visual_verification:
        threshold: pass
        type: hard_block
        message: Visual issues must be verified fixed
      coverage:
        threshold: 80
        type: soft_warning
        message: Test coverage should be >80%

# Optional Phases (activated on risk/need)
optional_phases:
  - name: performance_analysis
    agent: ios-performance-specialist
    trigger: performance_risk_detected
    outputs:
      - performance_profile
      - optimization_recommendations

  - name: security_audit
    agent: ios-security-specialist
    trigger: auth_or_sensitive_data
    outputs:
      - security_assessment
      - keychain_usage
      - privacy_manifest

  - name: accessibility_audit
    agent: ios-accessibility-specialist
    trigger: ui_heavy_feature
    outputs:
      - voiceover_compliance
      - dynamic_type_support
      - wcag_score


# Design-First Gate (Phase 0)
# design-system-architect / design-dna.json archived 2026-04-22 (design fork).
# The floor is now the /ios-impeccable overlay (ios-design-validator + swiftdesigncheck).
design_gate:
  position: "before planning"
  mechanism: design_lane_floor
  tiering:
    tweak: priming_only
    default: ios-ui-reviewer            # code-level design/token review in the gate sequence
    complex: ios-impeccable-overlay     # bind -> ios-design-builder -> ios-design-validator (gates.ios_design_lane)
  detector: swiftdesigncheck            # deterministic anti-pattern floor (SWIFT_DESIGN_DETECTOR_BIN)
  manifesto_priming: universal

# Configuration
config:
  max_implementation_passes: 2
  gate_failure_behavior: block_and_correct
  evidence_path: .orca/orchestration/evidence/
  phase_state_path: .orca/orchestration/phase_state.json

# Architecture Decision Rules
architecture_rules:
  swiftui_preferred:
    condition: ios_version >= 17 AND no_existing_uikit
    choice: SwiftUI + @Observable

  respect_existing:
    condition: has_mvvm OR has_tca OR has_uikit
    choice: Follow existing patterns

  data_strategy:
    swiftdata:
      condition: ios_version >= 17 AND no_existing_coredata
    coredata:
      condition: existing_coredata OR complex_sync
    grdb:
      condition: performance_critical OR sql_preference

# Specialist Activation Matrix
specialists:
  ios-swiftui-specialist:
    trigger: swiftui_views OR swiftui_architecture

  ios-uikit-specialist:
    trigger: uikit_views OR legacy_ui

  ios-persistence-specialist:
    trigger: data_layer_changes OR migration

  ios-networking-specialist:
    trigger: api_changes OR background_tasks

  ios-testing-specialist:
    trigger: new_logic OR swift_testing

  ios-ui-testing-specialist:
    trigger: ui_flows OR xcuitest

  # design-dna-guardian archived 2026-04-22; ios-design-validator (via /ios-impeccable)
  # fills that role for aesthetic-weight work.
