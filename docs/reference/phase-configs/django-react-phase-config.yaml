# Django-React Pipeline Phase Configuration - OS 4.1
# Full-stack Django + React TypeScript Development Workflow

pipeline:
  name: django-react
  description: Full-stack development pipeline with Django backend (DRF) and React TypeScript frontend
  version: "4.1"
  stacks:
    backend:
      framework: Django 4.2+
      api: Django REST Framework
      package_manager: uv
    frontend:
      framework: React 18+
      language: TypeScript
      package_manager: bun

# Phase State Schema (OS 3.1)
phase_state:
  # Top-level fields
  domain: django-react
  complexity_tier: simple | medium | complex
  requirement_id: string | null           # Links to requirements/<id>
  requirements_spec_path: string | null   # Path to 06-requirements-spec.md
  current_phase: string
  memory_summary: string | null           # Hits from memory-first search

  # Mode Tracking (OS 3.1)
  current_mode: planning | execution      # NEW: Explicit mode tracking
  mode_history:                           # NEW: Track mode transitions
    - mode: string
      timestamp: string
      reason: string

  # Attempt Tracking (OS 3.1)
  current_phase_attempts: 0               # NEW: Track retry attempts
  max_attempts: 3                         # NEW: Hard limit per spec

  # Phase entries (each has status, timestamps, data)
  phases:
    context_query: object
    planning: object
    api_contract: object | null           # Only if API changes
    backend_implementation: object
    frontend_implementation: object
    standards_gate: object
    implementation_pass2: object | null   # Only if gate failed
    verification: object

# Three-Tier Routing (OS 3.0)
# Default now runs gates. -tweak skips gates. --complex forces full pipeline.
complexity_tiers:
  default:
    description: Light path WITH quality gates (most work)
    flag: "(none)"
    routing: django-react-light-orchestrator
    mode: default  # Runs gates
    spec_required: false
    gates_required: true   # DEFAULT NOW RUNS GATES
    gates:
      - django-react-standards-enforcer
    examples:
      - Fix serializer validation
      - Update API endpoint
      - Change component prop
      - Fix form error message
      - Update single view

  tweak:
    description: Light path WITHOUT gates (pure speed)
    flag: "-tweak"
    routing: django-react-light-orchestrator
    mode: tweak  # Skips gates
    spec_required: false
    gates_required: false  # User verifies
    examples:
      - Rapid iteration
      - Exploring options
      - Quick experiments

  complex:
    description: Full pipeline with grand-architect
    flag: "--complex"
    routing: full_pipeline
    mode: complex
    spec_required: true    # BLOCKS without spec
    gates_required: true
    examples:
      - Multi-endpoint feature
      - Authentication system
      - Full-stack data flow
      - Multi-step checkout flow

# Context Integration (MANDATORY for medium/complex)
context:
  provider: ProjectContextServer
  required: true
  query_on_start: true
  memory_first: true      # Check Workshop/vibe.db before ProjectContext

# Pipeline Phases
phases:
  # Phase 1: Context Query
  - name: context_query
    agent: ProjectContextServer
    description: Memory-first context retrieval (Workshop + vibe.db)
    context_required: false
    outputs:
      - relevantFiles
      - projectState
      - pastDecisions
      - relatedStandards
    constraints:
      scope: Query both backend and frontend context
      quality: Complete full-stack understanding

  # Phase 2: Architecture & Planning
  - name: planning
    agent: django-react-architect
    description: Plan backend and frontend architecture
    dependencies:
      - context_query
    context_required: true
    outputs:
      - change_type
      - backend_plan
      - frontend_plan
      - api_contract_needed
      - risks
    constraints:
      scope: Analysis only, no code changes
      quality: Complete architecture assessment for both stacks
      integration: Identify DRF patterns and React patterns

  # Phase 3: API Contract Design (Optional)
  - name: api_contract
    agent: api-contract-specialist
    description: OpenAPI schema design/update before implementation
    dependencies:
      - planning
    condition: api_contract_needed
    context_required: true
    outputs:
      - openapi_schema_path
      - contract_changes
      - typescript_types
    constraints:
      scope: Schema design only
      quality: Complete type safety from backend to frontend

  # Phase 4: Backend Implementation
  - name: backend_implementation
    agent: django-react-builder
    description: Django backend implementation with DRF
    dependencies:
      - planning
      - api_contract
    context_required: true
    specialists:
      - django-master           # Models, ORM, migrations
      - django-api-specialist   # DRF viewsets, serializers
      - django-security-specialist  # Auth, permissions
    inputs:
      - backend_plan
      - openapi_schema
    outputs:
      - backend_files_modified
      - migrations_created
      - tests_added
      - ra_events          # OS 3.0: RA tags added during implementation
    constraints:
      scope: Edit-not-rewrite, minimal diffs
      quality: PEP8, type hints, DRF best practices
      integration: Use uv for all Python operations
      resource: Max file edits per pass

  # Phase 5: Frontend Implementation
  - name: frontend_implementation
    agent: django-react-builder
    description: React TypeScript frontend implementation
    dependencies:
      - backend_implementation
      - api_contract
    context_required: true
    specialists:
      - react-typescript-wizard    # React 18+, hooks, TypeScript
      - react-state-specialist     # TanStack Query, Zustand, forms
    inputs:
      - frontend_plan
      - typescript_types
    outputs:
      - frontend_files_modified
      - components_created
      - tests_added
      - ra_events          # OS 3.0: RA tags added during implementation
    constraints:
      scope: Edit-not-rewrite, minimal diffs
      quality: TypeScript strict, React best practices
      integration: Use bun for all frontend operations
      resource: Max file edits per pass

  # Phase 6: Standards Gate
  - name: standards_gate
    agent: django-react-standards-enforcer
    description: Full-stack standards verification
    dependencies:
      - backend_implementation
      - frontend_implementation
    context_required: true
    inputs:
      - backend_files_modified
      - frontend_files_modified
    outputs:
      - backend_standards_score
      - frontend_standards_score
      - violations
      - gate_decision
      - ra_audit           # OS 3.0: RA tag scan results
    quality_gates:
      backend_standards:
        threshold: 90
        type: hard_block
        message: Backend standards score must be ≥90
      frontend_standards:
        threshold: 90
        type: hard_block
        message: Frontend standards score must be ≥90
      api_contract_alignment:
        threshold: warn
        type: soft_warning
        message: API contract misalignment detected

  # Phase 7: Implementation - Pass 2 (Corrective)
  - name: implementation_pass2
    agent: django-react-builder
    description: Corrective implementation for gate failures only
    dependencies:
      - standards_gate
    condition: gate_failed
    context_required: true
    inputs:
      - violations
    outputs:
      - files_modified
      - fixes_applied
    constraints:
      scope: Fix violations only, no new features
      quality: Address all critical issues
      integration: Re-run failed gates only
      resource: Single corrective pass only

  # Phase 8: Build & Test Verification
  - name: verification
    agent: django-react-verification
    description: Build, test, and type-check verification
    mode: full_verification
    dependencies:
      - standards_gate
    context_required: true
    inputs:
      - backend_files_modified
      - frontend_files_modified
    outputs:
      - backend_build_status
      - frontend_build_status
      - backend_test_results
      - frontend_test_results
      - type_check_results
    quality_gates:
      backend_build:
        threshold: pass
        type: hard_block
        message: Django checks must succeed
      frontend_build:
        threshold: pass
        type: hard_block
        message: Frontend build must succeed
      backend_tests:
        threshold: pass
        type: hard_block
        message: Backend tests must pass
      frontend_tests:
        threshold: pass
        type: hard_block
        message: Frontend tests must pass
      type_safety:
        threshold: pass
        type: hard_block
        message: TypeScript must compile without errors

# Optional Phases (activated on risk/need)
optional_phases:
  - name: security_audit
    agent: django-security-specialist
    trigger: auth_or_sensitive_data
    outputs:
      - security_assessment
      - owasp_compliance

  - name: api_contract_validation
    agent: api-contract-specialist
    trigger: api_changes
    outputs:
      - contract_alignment_report

# Configuration
config:
  max_implementation_passes: 2
  gate_failure_behavior: block_and_correct
  evidence_path: .claude/orchestration/evidence/
  phase_state_path: .claude/orchestration/phase_state.json

# Tooling Configuration
tooling:
  backend:
    package_manager: uv
    test_command: "uv run pytest"
    django_commands: "uv run manage.py"
    migration_command: "uv run manage.py migrate"
    check_command: "uv run manage.py check"

  frontend:
    package_manager: bun
    test_command: "bun test"
    build_command: "bun run build"
    typecheck_command: "bun run typecheck"
    lint_command: "bun run lint"

# Specialist Activation Matrix
specialists:
  django-master:
    trigger: model_changes OR migration_needed

  django-api-specialist:
    trigger: drf_viewsets OR serializer_changes

  django-security-specialist:
    trigger: auth_changes OR permissions OR sensitive_data

  api-contract-specialist:
    trigger: api_changes OR new_endpoints

  react-typescript-wizard:
    trigger: react_components OR typescript_patterns

  react-state-specialist:
    trigger: state_management OR forms OR server_state
