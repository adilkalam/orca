# Requirements Pipeline Phase Configuration - OS 6.2

pipeline:
  name: requirements
  description: Requirements gathering lane for OS 6.2
  version: "6.0"

context:
  provider: ProjectContextServer
  required: true
  query_on_start: true

# Tier configurations
tiers:
  tweak:
    phases: [setup, scope_questions, spec]
    artifact: requirements-spec
    stance: committed

  default:
    phases: [setup, discovery_questions, context_findings, detail_questions, spec]
    artifact: requirements-spec
    stance: committed

  complex:
    phases: [setup, discovery_questions, context_findings, detail_questions, risk_analysis, spec]
    artifact: requirements-spec
    stance: committed

  explore:
    phases: [setup, exploration, minimal_questions, brief_generation]
    artifact: exploration-brief
    stance: tentative
    modes: [MAP, INVERT, PERSPECTIVES, EDGES, META, DEEP]
    dual_save: true
    cognition_path: .claude/cognition/

  from_brief:
    phases: [brief_validation, discovery_questions, context_findings, detail_questions, spec]
    artifact: requirements-spec
    stance: committed
    input_required: exploration-brief

phases:
  - name: setup
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Initialize requirement folder, metadata, and initial context
    context_required: true
    outputs:
      - requirement_folder
      - metadata_json
    constraints:
      scope: Create docs only, no implementation

  - name: discovery_questions
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Ask 5 high-level yes/no discovery questions with smart defaults
    dependencies:
      - setup
    context_required: true
    outputs:
      - discovery_questions
      - discovery_answers
    constraints:
      scope: Problem-space only, no technical implementation
      quality: Exactly 5 questions, yes/no with defaults

  - name: context_findings
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Targeted code/context analysis informed by discovery answers
    dependencies:
      - discovery_questions
    context_required: true
    outputs:
      - context_findings
      - context_files
    constraints:
      scope: Read-only analysis of codebase

  - name: detail_questions
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Ask 5 expert-level yes/no questions referencing specific code
    dependencies:
      - context_findings
    context_required: true
    outputs:
      - detail_questions
      - detail_answers
    constraints:
      scope: Behavior/requirements only, no implementation
      quality: Exactly 5 questions, tied to concrete files/patterns

  - name: spec
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Generate final requirements spec and update indexes
    dependencies:
      - detail_questions
    context_required: true
    outputs:
      - requirements_spec
      - updated_metadata
    constraints:
      scope: Documentation only
      integration: Log decision to code-index.db and update phase_state

  # Explore tier phases
  - name: exploration
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Run full deepthink-style divergent exploration
    dependencies:
      - setup
    context_required: true
    tier: explore
    outputs:
      - exploration_analysis
      - cognition_file
    constraints:
      scope: Divergent exploration, no commitment
      modes: Run all relevant modes (MAP, INVERT, PERSPECTIVES, EDGES, META, DEEP)
      self_check: Mandatory after each mode

  - name: minimal_questions
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Ask 2-3 targeted questions based on exploration findings
    dependencies:
      - exploration
    context_required: true
    tier: explore
    outputs:
      - exploration_questions
      - exploration_answers
    constraints:
      scope: Validate key unknowns only
      quality: 2-3 questions, informed by exploration

  - name: brief_generation
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Generate exploration brief with Go/No-Go criteria
    dependencies:
      - minimal_questions
    context_required: true
    tier: explore
    outputs:
      - exploration_brief
      - updated_metadata
    constraints:
      scope: Tentative brief, not committed spec
      required_sections: [Opportunity, Key Unknowns, Rough Shape, Risks, Go/No-Go Criteria]

  # From-brief tier phases
  - name: brief_validation
    agent: plan-command  # /plan command handles requirements directly (no helper agent)
    description: Validate and load exploration brief for conversion
    dependencies: []
    context_required: true
    tier: from_brief
    outputs:
      - validated_brief
      - brief_context
    constraints:
      scope: Read and validate brief structure
      input: exploration-brief path required

