# =============================================================================
# CHANGE IMPACT RULES
# How to trace dependencies when something changes
# =============================================================================
impact_rules:
  lane_add:
    create:
      - "agents/{lane}/*.md (minimum: architect, builder, light-orchestrator, standards-enforcer, verification)"
      - "commands/{lane}.md"
      - "docs/pipelines/{lane}-pipeline.md"
      - "docs/reference/phase-configs/{lane}-phase-config.yaml"
      - "quick-reference/workflows/readme-{lane}.md"
    update:
      - "quick-reference/ORCA-OS/ORCA-agents.md"
      - "quick-reference/ORCA-OS/ORCA-commands.md"
      - "quick-reference/ORCA-OS/ORCA-architecture.md"
      - "CLAUDE.md (agent count)"
      - "docs/reference/os-dependency-graph.yaml (this file)"
    if_mcp_required:
      - "Create {project}/.mcp.json"
      - "Update ~/.claude.json enabledMcpjsonServers"
      - "Update quick-reference/ORCA-OS/ORCA-mcps.md"

  agent_add:
    create:
      - "agents/{domain}/{agent-name}.md"
    update:
      - "docs/pipelines/{domain}-pipeline.md (add to roster)"
      - "quick-reference/ORCA-OS/ORCA-agents.md (count + section)"
      - "quick-reference/workflows/readme-{domain}.md (if significant)"
      - "CLAUDE.md (if count changes)"
      - "docs/reference/os-dependency-graph.yaml"
    verify:
      - "All MCPs in tools: section exist"
      - "All skills in skills: section exist"
      - "Command that orchestrates this agent references it"

  command_add:
    create:
      - "commands/{command}.md"
    update:
      - "quick-reference/ORCA-OS/ORCA-commands.md"
      - "quick-reference/workflows/readme-{domain}.md (if domain command)"
      - "docs/reference/os-dependency-graph.yaml"
    verify:
      - "All subagent_types reference existing agents"

  mcp_add:
    create:
      - "{project}/.mcp.json (if project-scoped)"
      - "mcp/{name}/ (if custom)"
    update:
      - "~/.claude.json (mcpServers or enabledMcpjsonServers)"
      - "quick-reference/ORCA-OS/ORCA-mcps.md"
      - "docs/reference/mcp-scoping-strategy.md (if scoping decision)"
      - "agents that use it (tools: section)"
      - "docs/reference/os-dependency-graph.yaml"

  skill_add:
    create:
      - "skills/{skill-name}.md or skills/{skill-name}/"
    update:
      - "agents that use it (skills: section)"
      - "docs/reference/os-dependency-graph.yaml"
