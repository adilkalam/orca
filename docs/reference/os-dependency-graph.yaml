# =============================================================================
# MCP REGISTRY
# All MCPs with their scoping
# =============================================================================
mcps:
  # Global MCPs (available to all projects)
  global:
    - name: cognition-mcp
      description: "Sequential thinking storage with accept-store-echo pattern"
      tools: [cognition]
      operations: [thought, mental_model, debug, decide, meta, systems, audit, session_info, session_export, session_import]
      pattern: "accept-store-echo (MCP stores and echoes, never generates)"
      used_by: [/think, /challenge, /audit]
    - name: sequential-thinking
      description: "Extended reasoning"
      tools: [sequentialthinking]
    - name: project-context
      description: "Project context queries + ORCA-Mem recall"
      tools: [query_context, save_decision, save_standard, save_task_history, index_project, reanalyze_project, recall]
      orca_mem_integration:
        recall_tool: "Retrieves archived tool outputs from ~/.claude/archives/"
        works_with: [hooks.post-tool-use, scripts.archive-cleanup]
    - name: context7
      description: "Library documentation"
      tools: [resolve-library-id, get-library-docs]
      default_disabled: true

  # Project-scoped MCPs
  project_scoped:
    - name: XcodeBuildMCP
      description: "iOS/macOS build automation"
      lanes: [ios]
    - name: chrome-devtools
      description: "Browser DevTools"
      lanes: [nextjs]
    - name: puppeteer
      description: "Browser automation (simpler, lighter alternative to Playwright)"
      lanes: [nextjs]
    - name: crawl4ai
      description: "Web content extraction"
      lanes: [research, nextjs]
      requires_manual_start: true

# =============================================================================
# COGNITION PERSISTENCE
# File-based persistence for cognitive command outputs
# =============================================================================
cognition_persistence:
  description: "Persistent storage for cognitive command analysis outputs"
  location: ".claude/cognition/"
  file_patterns:
    heavyweight:
      pattern: "YYYYMMDD-HHMM-<slug>.md"
      description: "Individual summary file per analysis"
      commands: [problem-solve, deepthink, challenge, ultra-think, root-cause]
    lightweight:
      pattern: "YYYYMMDD-daily.md"
      description: "Daily log with appended entries"
      commands: [think, contemplate]
  integration:
    workshop: "All entries also written to Workshop with -t [command] -t cognition"
    discovery: "workshop search cognition OR workshop why '<topic>'"
  recovery:
    method: "/think --import <sessionId>"
    requires: "cognition-mcp session still exists"

# =============================================================================
# ORCA-MEM COMPONENTS
# Context management via truncation and archival
# =============================================================================
orca_mem:
  description: "Context management system preventing conversation bloat"
  hooks:
    post-tool-use:
      location: hooks/post-tool-use.sh
      purpose: "Truncates large tool outputs, archives originals"
      triggers_on: "Every tool call completion"
      config:
        threshold: 4000
        head_preserve: 1500
        tail_preserve: 500
    session-end:
      location: hooks/session-end.sh
      purpose: "Captures session summary on exit"
      triggers_on: "Session termination"
  scripts:
    archive-cleanup:
      location: scripts/archive-cleanup.sh
      purpose: "Removes archives older than retention period"
      config:
        retention_days: 7
        archive_location: ~/.claude/archives/
  mcp_tool:
    name: recall
    server: project-context
    purpose: "Retrieves archived content by session/timestamp/query"

