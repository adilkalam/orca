# =============================================================================
# MCP REGISTRY
# All MCPs with their scoping
# =============================================================================
mcps:
  # Global MCPs (available to all projects)
  global:
    - name: cognition-mcp
      description: "Sequential thinking storage with accept-store-echo pattern"
      tools: [cognition]
      operations: [thought, mental_model, debug, decide, meta, systems, session_info, session_export, session_import]
      pattern: "accept-store-echo (MCP stores and echoes, never generates)"
      used_by: [/think, /challenge]
    - name: sequential-thinking
      description: "Extended reasoning"
      tools: [sequentialthinking]
    - name: project-context
      description: "Project context queries"
      tools: [query_context, save_decision, save_standard, save_task_history]
    - name: context7
      description: "Library documentation"
      tools: [resolve-library-id, get-library-docs]
      default_disabled: true

  # Project-scoped MCPs
  project_scoped:
    - name: XcodeBuildMCP
      description: "iOS/macOS build automation"
      lanes: [ios]
    - name: chrome-devtools
      description: "Browser DevTools"
      lanes: [nextjs]
    - name: puppeteer
      description: "Browser automation (simpler, lighter alternative to Playwright)"
      lanes: [nextjs]
    - name: crawl4ai
      description: "Web content extraction"
      lanes: [research, nextjs]
      requires_manual_start: true

