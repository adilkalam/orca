# ORCA-OS Dependency Graph Specification
# Source of truth for artifact relationships
# Used by /orca-os-dev to trace impacts and sync documentation
#
# Version: 3.1.0
# Last Updated: 2025-12-17

version: "3.1.0"

# =============================================================================
# ARTIFACT TYPE DEFINITIONS
# =============================================================================
artifact_types:
  lane:
    description: "A domain-specific pipeline (e.g., ios, nextjs, expo)"
    contains:
      - agents          # agents/{lane}/ directory
      - command         # commands/{lane}.md
      - pipeline_doc    # docs/pipelines/{lane}-pipeline.md
      - phase_config    # docs/reference/phase-configs/{lane}-phase-config.yaml
      - workflow_readme # quick-reference/workflows/readme-{lane}.md
    uses:
      - mcps           # Project-specific MCPs
    documented_in:
      - ORCA-architecture.md
      - ORCA-agents.md (domain section)
      - ORCA-commands.md (command entry)

  command:
    description: "A slash command (e.g., /ios, /nextjs, /expo)"
    orchestrates:
      - agents         # Via Task tool subagent_type
    documented_in:
      - ORCA-commands.md
      - workflow_readme (if domain command)

  agent:
    description: "A specialized worker (e.g., ios-builder, nextjs-architect)"
    requires:
      - mcps           # Via tools: section
      - skills         # Via skills: section (optional)
    belongs_to:
      - lane           # agents/{lane}/ directory
    documented_in:
      - ORCA-agents.md (domain section + count)
      - pipeline_doc (team roster)

  mcp:
    description: "Model Context Protocol server (e.g., alphavantage, XcodeBuildMCP)"
    enables:
      - agents         # Agents list MCPs in tools: section
    scopes:
      - global         # In ~/.claude.json mcpServers
      - project        # In {project}/.mcp.json + enabledMcpjsonServers
    documented_in:
      - ORCA-mcps.md
      - mcp-scoping-strategy.md

  skill:
    description: "Reusable behavior pattern (e.g., debugging-first)"
    used_by:
      - agents         # Agents list skills in skills: section
    may_use:
      - mcps
    documented_in:
      - skills catalog (TBD)

# =============================================================================
# DOCUMENTATION MAP
# What files track what artifacts
# =============================================================================
documentation_map:
  "quick-reference/ORCA-OS/ORCA-agents.md":
    tracks: [agents]
    auto_sections:
      - domain_rosters: "Per-lane agent listings"
      - count_table: "Agent counts by domain"
      - total_count: "Total agent count"
    update_triggers: [agent_add, agent_remove, agent_modify, lane_add]

  "quick-reference/ORCA-OS/ORCA-commands.md":
    tracks: [commands]
    auto_sections:
      - command_list: "All slash commands"
      - usage_docs: "Flags, examples per command"
    update_triggers: [command_add, command_remove, command_modify]

  "quick-reference/ORCA-OS/ORCA-mcps.md":
    tracks: [mcps]
    auto_sections:
      - mcp_configs: "Configuration examples"
      - scoping_rules: "Global vs project scoping"
      - agent_usage: "Which agents use which MCPs"
    update_triggers: [mcp_add, mcp_remove, mcp_scope_change]

  "quick-reference/ORCA-OS/ORCA-architecture.md":
    tracks: [lanes, memory_systems]
    auto_sections:
      - lane_list: "All domain lanes"
      - routing_flow: "How requests route to lanes"
    update_triggers: [lane_add, lane_remove, architecture_change]

  "docs/pipelines/{lane}-pipeline.md":
    tracks: [agents]
    scope: per_lane
    auto_sections:
      - agent_roster: "Team members"
      - phase_assignments: "Which agent handles which phase"
    update_triggers: [agent_add, agent_remove, agent_modify]

  "quick-reference/workflows/readme-{lane}.md":
    tracks: [commands, agents]
    scope: per_lane
    auto_sections:
      - workflow_steps: "How to use this lane"
      - examples: "Common usage patterns"
    update_triggers: [command_modify, workflow_change]

  "quick-reference/mental-models/":
    tracks: [mental_models]
    scope: global
    description: "Markdown templates for structured thinking frameworks"
    auto_sections:
      - frontmatter: "name, title, tags metadata"
      - process_steps: "Step-by-step application guide"
      - examples: "Concrete usage examples"
    update_triggers: [mental_model_add, mental_model_modify]
    referenced_by:
      - "commands/think.md (--model flag)"
      - "mcp/cognition-mcp (list_mental_models operation)"
      - "docs/concepts/cognition-mcp.md"

  "CLAUDE.md":
    tracks: [counts]
    auto_sections:
      - agent_count: "Total agent count in overview"
    update_triggers: [agent_add, agent_remove]

