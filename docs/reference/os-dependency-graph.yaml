    agents_dir: agents/audit
    agent_prefix: audit-
    agent_count: 8
    description: "Due diligence audit with parallel specialist agents"
    agents:
      # Core specialists (Phase 1)
      - audit-structure-specialist     # Dead code, naming, giant files, organization
      - audit-dependency-specialist    # Vulnerabilities, outdated, unused, licenses
      - audit-security-specialist      # Exposed secrets, insecure storage, HTTP, validation
